<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pin Wei · Posting helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="pwbar">
  <div class="wrap pwbar-in">
    <a class="wordmark" href="../"><img src="pinwei-mark.jpg" alt="" width="28" height="28"><span>Pin Wei Marketing</span></a>
    <button type="button" class="menubtn" aria-expanded="false" aria-controls="pwmenu">Menu</button>
    <div class="pwmenu" id="pwmenu">
      <nav class="sitenav" aria-label="Pin Wei Marketing"><a href="../">Home</a><a href="./" aria-current="page">Posting</a><a href="../kol/">KOL</a></nav>
      <nav class="tabs" id="tabs" aria-label="Posting sections">
        <a href="#compose" data-tab="compose">New post</a>
        <a href="#week" data-tab="week">Groups this week</a>
        <a href="#check" data-tab="check">Check</a>
        <a href="#dash" data-tab="dash">Dashboard</a>
        <a href="#plan" data-tab="plan">Content plan</a>
      </nav>
      <div class="pwacts"><a class="quiet" href="install.html">Bookmark</a><a class="pwcta" href="#compose">New post</a></div>
    </div>
  </div>
</header>
<main class="wrap wide" id="content" tabindex="-1">
  <div id="pagehead"></div>
  <div id="error"></div>
  <section id="t-compose" class="tab-body"><p class="muted">Loading…</p></section>
  <section id="t-week" class="tab-body" hidden></section>
  <section id="t-check" class="tab-body" hidden>
    <div class="subswitch" role="group" aria-label="Which day to check">
      <button type="button" class="subtab on" data-day="d1" aria-pressed="true">D+1</button>
      <button type="button" class="subtab" data-day="d3" aria-pressed="false">D+3</button>
    </div>
    <div id="t-d1" class="subbody"></div>
    <div id="t-d3" class="subbody" hidden></div>
  </section>
  <section id="t-dash" class="tab-body" hidden></section>
  <section id="t-plan" class="tab-body" hidden></section>
  <footer class="foot" id="foot"></footer>
</main>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="helper.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
